<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>講者手機遙控器</title>
<style>
:root{--bg:#060b18;--card:#111b2e;--border:#24344f;--text:#f8fafc;--muted:#94a3b8;--accent:#6366f1;--sky:#38bdf8;--ok:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;padding:14px 14px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.pill{padding:5px 11px;border-radius:999px;background:rgba(56,189,248,.16);color:var(--sky);font-size:13px;font-weight:700}
.count{padding:5px 11px;border-radius:999px;background:rgba(34,197,94,.16);color:#86efac;font-size:13px;font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:12px}
.q-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.q-title{font-size:18px;font-weight:800;line-height:1.4;margin:0}
.note{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:14px;line-height:1.55;color:#e0e7ff;white-space:pre-wrap}
.nav-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-bottom:10px}
.big-btn{padding:20px 12px;border:0;border-radius:16px;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-prev{background:#1e293b;color:var(--text);border:1px solid var(--border)}
.btn-next{background:linear-gradient(135deg,var(--accent),var(--sky));color:#fff}
.phase-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.ph-btn{padding:12px 10px;border-radius:12px;border:1px solid var(--border);background:#0d1628;color:var(--text);font-size:13px;font-weight:700;cursor:pointer}
.ph-btn.ok{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.16);color:#86efac}
.ph-btn.warn{border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.16);color:#fcd34d}
.ph-btn.sky{border-color:rgba(56,189,248,.5);background:rgba(56,189,248,.16);color:#7dd3fc}
.q-list{display:flex;flex-direction:column;gap:8px}
.q-row{padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:#0c1424;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.q-row.active{border-color:var(--sky);background:rgba(56,189,248,.16)}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(148,163,184,.18);color:#cbd5e1;font-weight:700;flex-shrink:0}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:#091020;color:var(--text);font-size:16px;margin-bottom:10px}
</style>
</head>
<body>
<div id="loginBox" class="card" style="max-width:360px;margin:60px auto;display:none">
  <h2 style="margin:0 0 8px">📱 講者手機遙控器</h2>
  <p style="color:var(--muted);font-size:13px;margin:0 0 14px">請掃描控場後台 QR Code 自動連線，或輸入密碼：</p>
  <input id="pwdIn" type="password" placeholder="輸入控場密碼">
  <button id="loginBtn" class="big-btn btn-next" style="width:100%;padding:14px">連線遙控器</button>
  <p id="errMsg" style="color:#fca5a5;font-size:13px;margin:8px 0 0"></p>
</div>

<div id="mainBox" style="display:none">
  <div class="top">
    <span id="topBadge" class="pill">已連線</span>
    <span id="liveCount" class="count">已參與 0 人</span>
  </div>

  <div class="card">
    <div class="q-meta"><span id="qMeta">--</span><span id="qStatus">--</span></div>
    <p id="qTitle" class="q-title">載入中...</p>
    <div id="qNote" class="note"></div>
  </div>

  <div class="nav-grid">
    <button id="prevBtn" class="big-btn btn-prev">⬅ 上一頁</button>
    <button id="nextBtn" class="big-btn btn-next">下一步 ➡</button>
  </div>

  <div class="phase-grid">
    <button id="voteBtn" class="ph-btn ok">▶ 開放作答</button>
    <button id="lockBtn" class="ph-btn warn">🔒 截止鎖定</button>
    <button id="revealBtn" class="ph-btn sky">✨ 揭曉答案</button>
    <button id="qrBtn" class="ph-btn">📱 切換浮動 QR</button>
  </div>

  <div id="danmakuCard" class="card" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:13px;color:var(--muted);font-weight:700">💬 點擊推上大螢幕聚焦</span>
      <button id="clearSpot" class="ph-btn" style="padding:4px 10px;font-size:12px">取消聚焦</button>
    </div>
    <div id="dmList" class="q-list" style="max-height:220px;overflow-y:auto"></div>
  </div>

  <div style="font-size:13px;color:var(--muted);margin:4px 0 8px;font-weight:700">📑 點擊快速跳頁</div>
  <div id="qList" class="q-list"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const urlParams = new URLSearchParams(location.search);
const roomId = urlParams.get('room') || 'main';
let token = urlParams.get('token') || sessionStorage.getItem('sdi_remote_token') || '';
if (urlParams.get('token')) {
  sessionStorage.setItem('sdi_remote_token', token);
  history.replaceState(null, '', '/remote?room=' + encodeURIComponent(roomId));
}
let state = null;
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function api(url, method = 'GET', body = null) {
  const sep = url.includes('?') ? '&' : '?';
  const opts = { method, headers: { 'x-admin-password': token } };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify({ roomId, ...body });
  }
  const r = await fetch(`${url}${sep}room=${encodeURIComponent(roomId)}`, opts);
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) {
    sessionStorage.removeItem('sdi_remote_token');
    $('loginBox').style.display = 'block';
    $('mainBox').style.display = 'none';
    throw new Error(d.message || '驗證失敗');
  }
  if (!r.ok) throw new Error(d.message || '操作失敗');
  return d;
}

async function initAuth(t) {
  token = t;
  try {
    const res = await api('/api/admin/login', 'POST', { password: token });
    sessionStorage.setItem('sdi_remote_token', token);
    $('loginBox').style.display = 'none';
    $('mainBox').style.display = 'block';
    state = res.state;
    render();
  } catch (e) {
    $('loginBox').style.display = 'block';
    $('mainBox').style.display = 'none';
    $('errMsg').textContent = e.message;
  }
}

$('loginBtn').onclick = () => initAuth($('pwdIn').value);
if (token) initAuth(token);
else $('loginBox').style.display = 'block';

async function ctrl(action, extra = {}) {
  try {
    const res = await api('/api/admin/control', 'POST', { action, ...extra });
    state = res.state;
    render();
  } catch (e) { alert(e.message); }
}

$('prevBtn').onclick = () => ctrl('prev');
$('nextBtn').onclick = () => ctrl('next');
$('voteBtn').onclick = () => ctrl('phase', { phase: 'VOTING' });
$('lockBtn').onclick = () => ctrl('phase', { phase: 'LOCKED' });
$('revealBtn').onclick = () => ctrl('phase', { phase: 'REVEALED' });
$('qrBtn').onclick = () => ctrl('toggleQr');
$('clearSpot').onclick = () => ctrl('spotlight', { msgId: null });

function render() {
  if (!state) return;
  $('topBadge').textContent = `${state.roomId} · ${state.idx + 1} / ${state.total}`;
  $('liveCount').textContent = `已參與 ${state.stats?.totalVotes || 0} 人`;
  $('qMeta').textContent = `#${state.order} · ${state.mode}${state.layout ? ' · ' + state.layout : ''}`;
  $('qStatus').textContent = state.phase;
  $('qTitle').textContent = state.title || '';
  $('qNote').textContent = state.speakerNote ? `🎙 口白提詞：${state.speakerNote}` : '（本頁無口白提詞）';

  $('qList').innerHTML = (state.deckList || []).map(item => `
    <div class="q-row ${item.index === state.idx ? 'active' : ''}" onclick="ctrl('goto',{index:${item.index}})">
      <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span class="tag">${esc(item.mode)}</span> ${esc(item.title)}</div>
      <span style="color:var(--muted);font-size:12px;flex-shrink:0">#${item.order}</span>
    </div>
  `).join('');

  const dmCard = $('danmakuCard');
  if (state.mode === 'DANMAKU') {
    dmCard.style.display = 'block';
    const msgs = (state.allMessages || []).filter(m => !m.hidden);
    const spotId = state.stats?.spotlightId;
    $('dmList').innerHTML = msgs.length === 0 ? '<div style="color:var(--muted);font-size:13px">尚無留言</div>' : msgs.map(m => `
      <div class="q-row ${spotId === m.id ? 'active' : ''}" onclick="ctrl('spotlight',{msgId:'${spotId === m.id ? '' : m.id}'})">
        <span><span class="tag">${esc(m.tag)}</span> ${esc(m.text)}</span>
        <span class="tag" style="color:${spotId === m.id ? '#fbbf24' : '#38bdf8'}">${spotId === m.id ? '聚光中' : '聚焦'}</span>
      </div>
    `).join('');
  } else {
    dmCard.style.display = 'none';
  }
}

setInterval(async () => {
  if (!token || $('mainBox').style.display === 'none') return;
  try { state = await api('/api/admin/state'); render(); } catch {}
}, 1200);
</script>
</body>
</html>
