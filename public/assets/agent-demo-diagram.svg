<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d24"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="680" rx="28" fill="url(#bg2)"/>
  <g stroke="#312e81" stroke-opacity="0.45" stroke-width="1">
    <path d="M0 170 H1280 M0 340 H1280 M0 510 H1280"/>
    <path d="M320 0 V680 M640 0 V680 M960 0 V680"/>
  </g>

  <text x="640" y="76" text-anchor="middle" fill="#f8fafc" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="32" font-weight="900">AI Agent 實戰開發三步驟：3 分鐘把痛點變成微工具</text>
  <text x="640" y="114" text-anchor="middle" fill="#a5b4fc" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18">不需背語法，只要把教學現場的真實需求說清楚</text>

  <!-- Card 1 -->
  <rect x="64" y="165" width="350" height="390" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="94" y="195" width="132" height="34" rx="17" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8"/>
  <text x="160" y="218" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="15" font-weight="800">STEP 1 · 1 分鐘</text>
  <text x="94" y="272" fill="#ffffff" font-family="Noto Sans TC, sans-serif" font-size="26" font-weight="800">說出痛點與情境</text>
  <rect x="94" y="305" width="290" height="215" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="114" y="344" fill="#e2e8f0" font-family="Noto Sans TC, sans-serif" font-size="17">「我是高中老師，希望有一個</text>
  <text x="114" y="376" fill="#e2e8f0" font-family="Noto Sans TC, sans-serif" font-size="17">單頁工具，貼上學生成績就能</text>
  <text x="114" y="408" fill="#e2e8f0" font-family="Noto Sans TC, sans-serif" font-size="17">自動標記預警名單並產出</text>
  <text x="114" y="440" fill="#e2e8f0" font-family="Noto Sans TC, sans-serif" font-size="17">給家長的溫暖簡訊草稿。」</text>
  <text x="114" y="492" fill="#38bdf8" font-family="Noto Sans TC, sans-serif" font-size="15" font-weight="700">✓ 用自然語言描述即可</text>

  <path d="M424 360 H460" stroke="url(#stepGrad)" stroke-width="6" stroke-linecap="round"/>
  <polygon points="456,348 476,360 456,372" fill="#38bdf8"/>

  <!-- Card 2 -->
  <rect x="465" y="165" width="350" height="390" rx="24" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
  <rect x="495" y="195" width="132" height="34" rx="17" fill="#4f46e5" fill-opacity="0.3" stroke="#818cf8"/>
  <text x="561" y="218" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif" font-size="15" font-weight="800">STEP 2 · 1 分鐘</text>
  <text x="495" y="272" fill="#ffffff" font-family="Noto Sans TC, sans-serif" font-size="26" font-weight="800">Agent 自動建置測試</text>
  <rect x="495" y="305" width="290" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="515" y="341" fill="#cbd5e1" font-family="Noto Sans TC, sans-serif" font-size="17">📂 自動建立專案與介面檔</text>
  <rect x="495" y="381" width="290" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="515" y="417" fill="#cbd5e1" font-family="Noto Sans TC, sans-serif" font-size="17">🔧 自動修改邏輯與除錯</text>
  <rect x="495" y="457" width="290" height="60" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="515" y="493" fill="#cbd5e1" font-family="Noto Sans TC, sans-serif" font-size="17">✅ 自動執行測試確認可運作</text>

  <path d="M825 360 H861" stroke="url(#stepGrad)" stroke-width="6" stroke-linecap="round"/>
  <polygon points="857,348 877,360 857,372" fill="#6366f1"/>

  <!-- Card 3 -->
  <rect x="866" y="165" width="350" height="390" rx="24" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
  <rect x="896" y="195" width="132" height="34" rx="17" fill="#059669" fill-opacity="0.25" stroke="#34d399"/>
  <text x="962" y="218" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="15" font-weight="800">STEP 3 · 1 分鐘</text>
  <text x="896" y="272" fill="#ffffff" font-family="Noto Sans TC, sans-serif" font-size="26" font-weight="800">開啟網頁馬上使用</text>
  <rect x="896" y="305" width="290" height="215" rx="14" fill="#1e293b" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="1041" y="356" text-anchor="middle" fill="#6ee7b7" font-family="Noto Sans TC, sans-serif" font-size="22" font-weight="800">🚀 專屬微工具上線</text>
  <text x="1041" y="404" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans TC, sans-serif" font-size="17">• 零手動複製貼上程式碼</text>
  <text x="1041" y="438" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans TC, sans-serif" font-size="17">• 隨時依需求微調迭代</text>
  <text x="1041" y="472" text-anchor="middle" fill="#cbd5e1" font-family="Noto Sans TC, sans-serif" font-size="17">• 推上雲端全校同事共用</text>

  <text x="640" y="625" text-anchor="middle" fill="#94a3b8" font-family="Noto Sans TC, sans-serif" font-size="17">「你不需要成為資訊專家，你需要的是發現教學痛點的眼睛。」</text>
</svg>
